<section>
  <div class="page-header">
    <h1>Add Transaction</h1>
    <p class="subtitle">Record a new income or expense</p>
  </div>

  <form class="panel form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="type-toggle">
      <label class="type-option" [class.selected]="form.controls.type.value === 'expense'">
        <input type="radio" formControlName="type" value="expense" (change)="onTypeChange()" />
        Expense
      </label>
      <label class="type-option" [class.selected]="form.controls.type.value === 'income'">
        <input type="radio" formControlName="type" value="income" (change)="onTypeChange()" />
        Income
      </label>
    </div>

    <div class="field">
      <label for="amount">Amount</label>
      <input id="amount" type="number" step="0.01" min="0.01" formControlName="amount" placeholder="0.00" />
      <span class="field-error" *ngIf="form.controls.amount.touched && form.controls.amount.invalid">
        Enter an amount greater than 0.
      </span>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select id="category" formControlName="category">
        <option value="" disabled>Select a category</option>
        <option *ngFor="let c of currentCategories" [value]="c">{{ c }}</option>
      </select>
      <span class="field-error" *ngIf="form.controls.category.touched && form.controls.category.invalid">
        Category is required.
      </span>
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date" formControlName="date" />
    </div>

    <div class="field">
      <label for="description">Description (optional)</label>
      <textarea id="description" formControlName="description" rows="2" placeholder="Notes about this transaction"></textarea>
    </div>

    <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>

    <div class="actions">
      <button type="submit" class="btn primary" [disabled]="submitting">
        {{ submitting ? 'Saving...' : 'Save Transaction' }}
      </button>
      <button type="button" class="btn" (click)="goToList()">View Transactions</button>
    </div>
  </form>
</section>
